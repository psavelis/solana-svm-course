apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solana-study-ingress
  namespace: solana-study
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - solana-study.local
    - api.solana-study.local
    secretName: solana-study-tls
  rules:
  - host: api.solana-study.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: solana-study-app-service
            port:
              number: 3000
  - host: solana-study.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: solana-study-app-service
            port:
              number: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: solana-study-postgres-service
  namespace: solana-study
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: solana-study-redis-service
  namespace: solana-study
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: solana-study-kafka-service
  namespace: solana-study
spec:
  selector:
    app: kafka
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
  - name: kafka-external
    port: 9094
    targetPort: 9094
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: solana-study-zookeeper-service
  namespace: solana-study
spec:
  selector:
    app: zookeeper
  ports:
  - port: 2181
    targetPort: 2181
  type: ClusterIP