apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: solana-study
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'solana-study-app'
        static_configs:
          - targets: ['solana-study-app-service:3000']
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-service:5432']
      - job_name: 'kafka'
        static_configs:
          - targets: ['kafka-service:9092']
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-service:6379']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: solana-study
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: solana-study
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
  type: ClusterIP